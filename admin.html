<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Oversigt · Vilfreds dåb</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/config.js?v=20261101e"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #F4F2ED; --card: #fff; --ink: #1F2A33; --muted: #56616B; --accent: #4A6378; --accent-dk: #364B5C;
    --line: #DDD8CE; --ok: #2E7D5B; --ok-bg: #E3F3EB; --no: #9B3328; --no-bg: #F8E6E3; --wait: #7A5A12; --wait-bg: #FBF0D5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; font: 600 15px inherit; font-family: inherit; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--accent-dk); }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn.ghost:hover { background: #EEF2F5; }
  .btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
  .btn.danger { border-color: var(--no); color: var(--no); background: #fff; }
  .btn.danger.sure { background: var(--no); color: #fff; }
  input, textarea, select { font: inherit; color: var(--ink); border: 1px solid #B9B3A7; border-radius: 8px; padding: 10px 12px; background: #fff; min-height: 44px; }
  textarea { width: 100%; resize: vertical; }
  label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }

  .login { max-width: 380px; margin: 12vh auto 0; }
  .login input { width: 100%; }
  .err { color: var(--no); font-weight: 600; min-height: 1.5em; margin-top: 8px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 30px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 14px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .tab { min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit; font-size: 14px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .guest { border-top: 1px solid var(--line); padding: 14px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
  .guest:first-child { border-top: 0; }
  .g-name { font-weight: 700; font-size: 17px; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .b-lang { background: #E8EEF6; color: #34506B; }
  .b-ok { background: var(--ok-bg); color: var(--ok); } .b-no { background: var(--no-bg); color: var(--no); } .b-wait { background: var(--wait-bg); color: var(--wait); }
  .g-meta { color: var(--muted); font-size: 14px; }
  .g-msg { font-style: italic; margin-top: 4px; white-space: pre-line; }
  .g-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: flex-start; }
  @media (max-width: 640px) { .guest { grid-template-columns: 1fr; } .g-actions { justify-content: flex-start; } }

  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .lists ul { margin: 0; padding-left: 18px; }
  .lists li + li { margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 10; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <section id="login-view" class="login card" hidden>
    <h1>Vilfreds dåb</h1>
    <p class="muted">Log ind for at se tilmeldingerne. Det er samme login som i Pligter.</p>
    <form id="login-form" style="margin-top:16px">
      <label class="lbl" for="pw">Adgangskode for <span id="login-email"></span></label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="width:100%;margin-top:12px">Log ind</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </section>

  <!-- Oversigt -->
  <section id="app-view" hidden>
    <header class="top">
      <div>
        <h1>Vilfreds dåb · tilmeldinger</h1>
        <p class="muted" id="updated"></p>
      </div>
      <div class="row">
        <button class="btn ghost small" id="refresh" type="button">Opdatér</button>
        <button class="btn ghost small" id="csv" type="button">Hent som CSV</button>
        <button class="btn ghost small" id="logout" type="button">Log ud</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>Tilføj gæster</h2>
      <p class="muted" style="margin:0 0 10px">Én husstand pr. linje, fx <em>Mormor &amp; Morfar</em>. Hver får sit eget personlige link.</p>
      <textarea id="new-guests" rows="3" placeholder="Mormor &amp; Morfar&#10;Faster Line, Peter og børnene"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="add" type="button">Tilføj</button>
        <label class="muted" for="new-lang" style="margin-left:auto">Invitationens sprog</label>
        <select id="new-lang">
          <option value="da">Dansk</option>
          <option value="es">Spansk</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Gæster</h2>
      <div class="tabs" id="tabs">
        <button class="tab" data-f="alle" aria-pressed="true" type="button">Alle</button>
        <button class="tab" data-f="ja" aria-pressed="false" type="button">Kommer</button>
        <button class="tab" data-f="nej" aria-pressed="false" type="button">Afbud</button>
        <button class="tab" data-f="mangler" aria-pressed="false" type="button">Mangler svar</button>
      </div>
      <div id="list"></div>
    </div>

    <div class="lists">
      <div class="card"><h2>Allergier og kosthensyn</h2><ul id="allergies"></ul></div>
      <div class="card"><h2>Gæt på Vilfreds vægt</h2><ul id="guesses"></ul></div>
    </div>
    <div class="card"><h2>Hilsner til Vilfred</h2><div id="messages"></div></div>
  </section>
</div>

<script>
(() => {
  const C = window.DAAB;
  const EJER = 'achris@live.dk';
  const sb = supabase.createClient(C.sbUrl, C.sbKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const $ = (id) => document.getElementById(id);
  let rows = [];
  let filter = 'alle';

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
    }
    kids.flat().forEach((k) => { if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : String(k)); });
    return el;
  }
  function toast(t) {
    const el = h('div', { class: 'toast', role: 'status' }, t);
    document.body.append(el);
    setTimeout(() => el.remove(), 2200);
  }
  const fmtKg = (v) => String(v).replace('.', ',');
  const fmtDate = (s) => new Date(s).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  const flertal = (n) => /(&|\bog\b|\by\b|,|\+|familia)/i.test(n || '');
  const link = (g) => C.siteUrl + '?g=' + encodeURIComponent(g.token) + (g.sprog === 'es' ? '&l=es' : '');
  const message = (g) => g.sprog === 'es'
    ? (flertal(g.navn)
        ? `Hola, ${g.navn}: Vilfred será bautizado el sábado 23 de enero de 2027 y nos encantaría que nos acompañen. Pueden abrir su invitación aquí: ${link(g)}`
        : `Hola, ${g.navn}: Vilfred será bautizado el sábado 23 de enero de 2027 y nos encantaría que nos acompañe. Puede abrir su invitación aquí: ${link(g)}`)
    : `Hej ${g.navn}! Vilfred skal døbes lørdag den 23. januar 2027, og I er inviteret. Åbn jeres invitation her: ${link(g)}`;

  async function copy(text, what) {
    try { await navigator.clipboard.writeText(text); toast(what + ' kopieret'); }
    catch (e) { window.prompt('Kopiér:', text); }
  }

  // Login
  async function init() {
    $('login-email').textContent = EJER;
    const { data } = await sb.auth.getSession();
    if (data.session) showApp(); else $('login-view').hidden = false;
  }
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: EJER, password: $('pw').value });
    if (error) { $('login-err').textContent = 'Forkert adgangskode – prøv igen.'; return; }
    $('pw').value = '';
    showApp();
  });
  $('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

  async function showApp() {
    $('login-view').hidden = true;
    $('app-view').hidden = false;
    await load();
  }

  async function load() {
    const { data, error } = await sb.from('daab_gaester').select('*').order('svaret_at', { ascending: false, nullsFirst: false }).order('oprettet_at', { ascending: true });
    if (error) { toast('Kunne ikke hente data: ' + error.message); return; }
    rows = data || [];
    $('updated').textContent = 'Opdateret ' + new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
    render();
  }
  $('refresh').addEventListener('click', load);

  // Tilføj
  $('add').addEventListener('click', async () => {
    const names = $('new-guests').value.split('\n').map((s) => s.trim()).filter(Boolean).map((s) => s.slice(0, 120));
    if (!names.length) return;
    const { error } = await sb.from('daab_gaester').insert(names.map((navn) => ({ navn, sprog: $('new-lang').value })));
    if (error) { toast('Fejl: ' + error.message); return; }
    $('new-guests').value = '';
    toast(names.length === 1 ? '1 gæst tilføjet' : names.length + ' gæster tilføjet');
    load();
  });

  // Filtre
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    render();
  }));

  async function setLang(g, sprog) {
    const { error } = await sb.from('daab_gaester').update({ sprog }).eq('id', g.id);
    if (error) { toast('Fejl: ' + error.message); return; }
    toast(g.navn + (sprog === 'es' ? ' får nu invitationen på spansk' : ' får nu invitationen på dansk'));
    load();
  }

  async function del(g, btn) {
    if (!btn.classList.contains('sure')) {
      btn.classList.add('sure'); btn.textContent = 'Slet – sikker?';
      setTimeout(() => { btn.classList.remove('sure'); btn.textContent = 'Slet'; }, 4000);
      return;
    }
    const { error } = await sb.from('daab_gaester').delete().eq('id', g.id);
    if (error) { toast('Fejl: ' + error.message); return; }
    toast(g.navn + ' slettet');
    load();
  }

  function render() {
    // Tal
    const ja = rows.filter((r) => r.deltager === true);
    const nej = rows.filter((r) => r.deltager === false);
    const mangler = rows.filter((r) => r.deltager === null);
    const sum = (a, k) => a.reduce((s, r) => s + (r[k] || 0), 0);
    const kirke = ja.filter((r) => r.dele !== 'frokost');
    const frokost = ja.filter((r) => r.dele !== 'kirke');
    const stats = [
      [sum(ja, 'voksne') + sum(ja, 'boern'), 'personer kommer i alt'],
      [sum(ja, 'voksne'), 'voksne'],
      [sum(ja, 'boern'), 'børn'],
      [sum(kirke, 'voksne') + sum(kirke, 'boern'), 'i kirken'],
      [sum(frokost, 'voksne') + sum(frokost, 'boern'), 'til frokost'],
      [nej.length, 'afbud (husstande)'],
      [mangler.length, 'mangler svar'],
    ];
    $('stats').replaceChildren(...stats.map(([n, l]) => h('div', { class: 'stat' }, h('b', null, n), h('span', null, l))));

    // Liste
    const show = rows.filter((r) => filter === 'alle' || (filter === 'ja' && r.deltager === true) || (filter === 'nej' && r.deltager === false) || (filter === 'mangler' && r.deltager === null));
    const list = $('list');
    if (!show.length) { list.replaceChildren(h('p', { class: 'muted' }, rows.length ? 'Ingen i denne kategori.' : 'Ingen gæster endnu. Tilføj nogle ovenfor.')); }
    else list.replaceChildren(...show.map((g) => {
      const badge = g.deltager === true ? h('span', { class: 'badge b-ok' }, 'Kommer')
        : g.deltager === false ? h('span', { class: 'badge b-no' }, 'Afbud') : h('span', { class: 'badge b-wait' }, 'Mangler svar');
      const meta = [];
      if (g.deltager) {
        meta.push(`${g.voksne} voksne, ${g.boern} børn`);
        meta.push(g.dele === 'kirke' ? 'kun kirken' : g.dele === 'frokost' ? 'kun frokosten' : 'kirke + frokost');
      }
      if (g.allergier) meta.push('Hensyn: ' + g.allergier);
      if (g.vaegt_gaet != null) meta.push('Vægtgæt: ' + fmtKg(g.vaegt_gaet) + ' kg');
      if (g.svaret_at) meta.push('Svarede ' + fmtDate(g.svaret_at));
      if (g.oprettet_af === 'gaest') meta.push('tilmeldt uden personligt link');
      const delBtn = h('button', { class: 'btn danger small', type: 'button' }, 'Slet');
      delBtn.addEventListener('click', () => del(g, delBtn));
      const actions = [
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => copy(link(g), 'Link') }, 'Kopiér link'),
        h('button', { class: 'btn ghost small', type: 'button', onclick: () => copy(message(g), 'Besked') }, 'Kopiér besked'),
      ];
      if (navigator.share) actions.push(h('button', { class: 'btn ghost small', type: 'button', onclick: () => navigator.share({ text: message(g) }).catch(() => {}) }, 'Del'));
      actions.push(h('button', { class: 'btn ghost small', type: 'button', onclick: () => setLang(g, g.sprog === 'es' ? 'da' : 'es') },
        g.sprog === 'es' ? 'Skift til dansk' : 'Skift til spansk'));
      actions.push(delBtn);
      return h('div', { class: 'guest' },
        h('div', null,
          h('div', null, h('span', { class: 'g-name' }, g.navn), badge, g.sprog === 'es' ? h('span', { class: 'badge b-lang' }, 'Spansk') : null),
          meta.length ? h('div', { class: 'g-meta' }, meta.join(' · ')) : null,
          g.hilsen ? h('div', { class: 'g-msg' }, '“' + g.hilsen + '”') : null),
        h('div', { class: 'g-actions' }, actions));
    }));

    // Allergier, vægt, hilsner
    const al = ja.filter((r) => r.allergier);
    $('allergies').replaceChildren(...(al.length ? al.map((r) => h('li', null, h('b', null, r.navn + ': '), r.allergier)) : [h('li', { class: 'muted' }, 'Ingen endnu')]));
    const gu = rows.filter((r) => r.vaegt_gaet != null).sort((a, b) => a.vaegt_gaet - b.vaegt_gaet);
    $('guesses').replaceChildren(...(gu.length ? gu.map((r) => h('li', null, h('b', null, fmtKg(r.vaegt_gaet) + ' kg'), ' – ' + r.navn)) : [h('li', { class: 'muted' }, 'Ingen gæt endnu')]));
    const ms = rows.filter((r) => r.hilsen);
    $('messages').replaceChildren(...(ms.length ? ms.map((r) => h('p', { style: 'margin:0 0 14px' }, h('span', { class: 'g-msg', style: 'display:block' }, '“' + r.hilsen + '”'), h('span', { class: 'muted' }, '– ' + r.navn))) : [h('p', { class: 'muted' }, 'Ingen hilsner endnu')]));
  }

  // CSV (semikolon + BOM, så Excel på dansk åbner den pænt)
  $('csv').addEventListener('click', () => {
    const head = ['Navn', 'Sprog', 'Svar', 'Voksne', 'Børn', 'Deltager i', 'Allergier', 'Vægtgæt (kg)', 'Hilsen', 'Svaret', 'Link'];
    const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = rows.map((r) => [
      r.navn, r.sprog === 'es' ? 'Spansk' : 'Dansk', r.deltager === true ? 'Kommer' : r.deltager === false ? 'Afbud' : 'Mangler svar',
      r.deltager ? r.voksne : '', r.deltager ? r.boern : '',
      r.deltager ? (r.dele === 'kirke' ? 'Kun kirken' : r.dele === 'frokost' ? 'Kun frokosten' : 'Kirke + frokost') : '',
      r.allergier, r.vaegt_gaet != null ? fmtKg(r.vaegt_gaet) : '', r.hilsen, r.svaret_at ? fmtDate(r.svaret_at) : '', link(r),
    ].map(q).join(';'));
    const blob = new Blob(['﻿' + [head.map(q).join(';'), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'vilfreds-daab-tilmeldinger.csv' });
    document.body.append(a); a.click(); a.remove();
  });

  init();
})();
</script>
</body>
</html>
