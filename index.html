<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vilfred skal døbes</title>
<meta property="og:title" content="Vilfred skal døbes">
<meta property="og:description" content="Lørdag den 23. januar 2027 kl. 11.00 · Nathanaels Kirke · Åbn din invitation">
<meta property="og:image" content="https://tragisk.github.io/vilfreds-daab/og-klassisk.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/config.js"></script>
<script>
  // Send gæsten videre til den valgte version – og behold det personlige link (?g=…)
  (function () {
    var v = window.DAAB && window.DAAB.valgtVersion;
    if (v === 'klassisk' || v === 'farverig') location.replace(v + '.html' + location.search);
  })();
</script>
<style>
  :root { --bg: #F7F5F0; --ink: #1F2A33; --muted: #4A5560; --accent: #4A6378; --line: #D9D4C9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px 16px; }
  .wrap { max-width: 640px; width: 100%; text-align: center; }
  h1 { font-size: 28px; margin: 0; }
  p { color: var(--muted); margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 28px; }
  a.card { display: block; padding: 28px 20px; border-radius: 16px; text-decoration: none; color: var(--ink); border: 2px solid var(--line); background: #fff; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  .sw { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .sw span { width: 22px; height: 22px; border-radius: 50%; }
  .card strong { font-size: 20px; display: block; }
  .small { font-size: 14px; margin-top: 24px; }
  .small a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Vilfreds dåbsinvitation</h1>
    <p>To versioner at vælge imellem. Når I har valgt, sender hovedlinket gæsterne direkte videre.</p>
    <div class="grid">
      <a class="card" id="go-klassisk" href="klassisk.html">
        <div class="sw"><span style="background:#F7F5F0;border:1px solid #D9D4C9"></span><span style="background:#4A6378"></span><span style="background:#7D8F7A"></span></div>
        <strong>Klassisk</strong>
        <p>Som det trykte kort: dueblå, grene og vokssegl</p>
      </a>
      <a class="card" id="go-farverig" href="farverig.html">
        <div class="sw"><span style="background:#F2604E"></span><span style="background:#FFC94A"></span><span style="background:#5BB8F5"></span><span style="background:#3CC6A0"></span></div>
        <strong>Farverig</strong>
        <p>Legende luftpostkuvert, konfetti og polaroids</p>
      </a>
    </div>
    <p class="small"><a href="admin.html">Oversigt over tilmeldinger</a></p>
  </div>
  <script>
    document.getElementById('go-klassisk').href += location.search;
    document.getElementById('go-farverig').href += location.search;
  </script>
</body>
</html>
